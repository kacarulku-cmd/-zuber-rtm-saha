<!doctype html><html lang='tr'><head><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><meta name='apple-mobile-web-app-title' content='ZÜBER RTM'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ZÜBER RTM Saha</title>
<style>:root{--bg:#f4f6f8;--card:#fff;--ink:#18202a;--muted:#6b7280;--accent:#111827;--ok:#e8f5e9;--warn:#fff7e6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;background:#111827;color:white;padding:18px 20px;z-index:5}header h1{margin:0;font-size:20px}header small{opacity:.8}.wrap{max-width:1000px;margin:auto;padding:18px}.toolbar,.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px #00000010}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#111827;color:white}button.secondary{background:#e5e7eb;color:#111827}input,select,textarea{width:100%;padding:10px;border:1px solid #d7dce2;border-radius:9px;font:inherit}textarea{min-height:70px}.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.store{background:white;border-radius:14px;padding:14px;border:1px solid #e5e7eb;cursor:pointer}.store h3{margin:0 0 6px}.store-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.mapbtn{display:inline-block;text-decoration:none;background:#2563eb;color:white;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700}.meta{font-size:13px;color:var(--muted)}.status{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:999px;font-size:12px;background:#eee}.done{background:#dcfce7;color:#166534}.active{background:#fef3c7;color:#92400e}.section{border-top:1px solid #eee;padding-top:14px;margin-top:14px}.section h3{margin:0 0 10px}.q{margin:10px 0}.choices{display:flex;gap:7px;flex-wrap:wrap}.choice{background:#f3f4f6;color:#111827;padding:7px 9px;font-weight:600}.choice.sel{background:#111827;color:white}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos img{width:90px;height:90px;object-fit:cover;border-radius:9px;border:1px solid #ddd}.hidden{display:none}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:8px;background:#eee;border-radius:20px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#111827}.notice{font-size:13px;color:#6b7280}.danger{background:#fee2e2!important;color:#991b1b!important}@media(max-width:600px){.wrap{padding:10px}.toolbar{padding:12px}}</style></head><body>
<header><h1>ZÜBER RTM Saha</h1><small>Gün → Rota → Mağaza → Kontrol → Fotoğraf → Aksiyon</small></header><main class='wrap'>
<div id='home'>
<div class='toolbar'><div style='flex:1;min-width:180px'><label><b>Ziyaret günü</b></label><input id='day' type='date'></div><button onclick='addStore()'>+ Mağaza Ekle</button><button class='secondary' onclick='exportData()'>Analiz İçin Dışa Aktar</button><label class='btn secondary'>Veri İçe Aktar<input class='hidden' type='file' accept='.json' onchange='importData(event)'></label></div>
<div class='card'><div class='topline'><div><b id='dayTitle'></b><div class='meta' id='routeTitle'></div></div><div id='summary'></div></div><div class='progress'><div id='prog'></div></div></div>
<div id='stores' class='stores'></div></div>
<div id='visit' class='hidden'></div></main>
<script>
const qs=[
['Bulunurluk & SKU',[['ZÜBER rafta mevcut mu?',['Evet','Hayır']],['SKU sayısı',null],['Eksik SKU / OOS ürünler',null],['Depoda olup rafta olmayan ürün var mı?',['Evet','Hayır','Bilinmiyor']]]],
['Raf & Görünürlük',[['Raf konumu',['İyi','Orta','Zayıf']],['Göz hizasında mı?',['Evet','Hayır']],['Facing sayısı',null],['Blok ZÜBER görünümü var mı?',['Evet','Kısmen','Hayır']],['Fiyat etiketi doğru ve görünür mü?',['Evet','Hayır']]]],
['Fiyat & Promosyon',[['ZÜBER fiyat / kampanya notu',null],['Rakip fiyat / kampanya notu',null],['Etiket veya fiyat problemi var mı?',['Yok','Var']]]],
['Rakip Kontrolü',[['Ana rakip markalar',null],['Yeni ürün / SKU gördün mü?',['Hayır','Evet']],['Rakip görünürlüğü',['ZÜBER daha güçlü','Benzer','Rakip daha güçlü']],['Dikkat çeken rakip aktivitesi',null]]],
['İkincil Teşhir',[['Kasa önü / gondol / stand var mı?',['Var','Yok']],['ZÜBER için ek teşhir fırsatı var mı?',['Evet','Hayır']],['Fırsat notu',null]]],
['Soğuk Ürün',[['ZÜBER soğuk ürün mevcut mu?',['Evet','Hayır','Uygulanamaz']],['Soğuk SKU / OOS notu',null],['Dolap konumu ve düzeni',['İyi','Orta','Zayıf','Uygulanamaz']],['Rakip ürün dolapta mı?',['Evet','Hayır','Uygulanamaz']]]],
['Mağaza Görüşü',[['En hızlı dönen ZÜBER ürünü',null],['Stok problemi yaşanan ürün',null],['Müşterinin sorduğu eksik ürün',null],['Hızlı dönen rakip ürün',null]]],
['Ziyaret Sonucu',[['En önemli 3 bulgu',null],['Bayi aksiyonu',null],['Bölge Müdürü aksiyonu',null],['Merkez aksiyonu',null],['Tekrar kontrol notu',null]]]
];
const seed=[
['Happy Center Bostancı','Bostancı Mah. Yalı Yolu Sk. No:30/A, Kadıköy/İstanbul'],
['Çağrı Market Bostancı','Bostancı Mah. Küçük Yol Sk. No:9, Kadıköy/İstanbul'],
['Mopaş Bostancı','Bostancı Mah. Palmiye Sk. No:19, Kadıköy/İstanbul'],
['Mopaş Hisar','Bostancı Mah. Hisar Sk. No:19, Kadıköy/İstanbul'],
['Çağrı Market Kozyatağı','Bostancı Mah. Tariki Has Sk. No:2, Kadıköy/İstanbul'],
['Mopaş Kocayol','Şenesenevler Mah. Kocayol Cd. No:13/15, Kadıköy/İstanbul'],
['Mopaş Kozyatağı 1','19 Mayıs Mah. Bayar Cd. No:11, Kadıköy/İstanbul'],
['Happy Center Erenköy','19 Mayıs Mah. Bayar Cd. No:39/A, Kadıköy/İstanbul'],
['Mopaş Sinan Ercan','19 Mayıs Mah. Sinan Ercan Cd. No:25, Kadıköy/İstanbul'],
['Mopaş Ethem Efendi','Ethem Efendi Cd. Çiçek Sk. No:7 D:1, Kadıköy/İstanbul']];
let db=JSON.parse(localStorage.getItem('zuberRTM')||'{}');let current=null;const today='2026-09-24';
if(!db[today]) db[today]={route:'Bostancı → Kozyatağı → Erenköy',stores:seed.map((s,i)=>({id:Date.now()+i,name:s[0],address:s[1],status:'Başlanmadı',answers:{},photos:[]}))}; else { const untouched=db[today].stores?.every(x=>x.status==='Başlanmadı'&&(!x.photos||!x.photos.length)&&(!x.answers||Object.keys(x.answers).length===0)); if(untouched) db[today]={route:'Bostancı → Kozyatağı → Erenköy',stores:seed.map((s,i)=>({id:Date.now()+i,name:s[0],address:s[1],status:'Başlanmadı',answers:{},photos:[]}))}; } save();
function save(){localStorage.setItem('zuberRTM',JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const day=document.getElementById('day');day.value=today;day.onchange=renderHome;
function renderHome(){let d=day.value;if(!db[d])db[d]={route:'Yeni saha günü',stores:[]};save();let x=db[d];document.getElementById('dayTitle').textContent=new Date(d+'T12:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('routeTitle').textContent=x.route;let done=x.stores.filter(s=>s.status==='Tamamlandı').length;document.getElementById('summary').textContent=`${done}/${x.stores.length} tamamlandı`;document.getElementById('prog').style.width=(x.stores.length?done/x.stores.length*100:0)+'%';document.getElementById('stores').innerHTML=x.stores.map((s,i)=>`<div class='store'><div onclick='openStore(${i})'><h3>${i+1}. ${esc(s.name)}</h3><div class='meta'>${esc(s.address)}</div><span class='status ${s.status==='Tamamlandı'?'done':s.status==='Ziyarette'?'active':''}'>${s.status}</span></div><div class='store-actions'><a class='mapbtn' target='_blank' rel='noopener' href='https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.address)}' onclick='event.stopPropagation()'>🧭 Yol Tarifi</a><button class='secondary' onclick='openStore(${i})'>Ziyarete Başla</button></div></div>`).join('')||`<div class='card'>Bu güne henüz mağaza eklenmedi.</div>`}
function addStore(){let d=day.value,n=prompt('Mağaza adı?');if(!n)return;let a=prompt('Adres / lokasyon?')||'';db[d].stores.push({id:Date.now(),name:n,address:a,status:'Başlanmadı',answers:{},photos:[]});save();renderHome()}
function openStore(i){current={d:day.value,i};let s=db[current.d].stores[i];if(s.status==='Başlanmadı')s.status='Ziyarette';save();document.getElementById('home').classList.add('hidden');let html=`<div class='toolbar'><button class='secondary' onclick='back()'>← Günün Rotası</button><button onclick='finish()'>✓ Ziyareti Tamamla</button></div><div class='card'><h2 style='margin:0'>${esc(s.name)}</h2><div class='meta'>${esc(s.address)}</div><div style='margin-top:10px'><a class='mapbtn' target='_blank' rel='noopener' href='https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.address)}'>🧭 Google Maps Yol Tarifi</a></div><div class='q'><label><b>Ziyaret notu</b></label><textarea oninput="ans('Genel','Ziyaret notu',this.value)">${esc(s.answers?.Genel?.['Ziyaret notu']||'')}</textarea></div></div>`;
qs.forEach(([sec,arr])=>{html+=`<div class='card section'><h3>${sec}</h3>`;arr.forEach(([q,opts])=>{let v=s.answers?.[sec]?.[q]||'';html+=`<div class='q'><label><b>${q}</b></label>`;if(opts){html+=`<div class='choices'>${opts.map(o=>`<button class='choice ${v===o?'sel':''}' onclick="ans('${sec.replaceAll("'","\\'")}','${q.replaceAll("'","\\'")}','${o.replaceAll("'","\\'")}');openStore(${i})">${o}</button>`).join('')}</div>`}else html+=`<textarea oninput="ans('${sec.replaceAll("'","\\'")}','${q.replaceAll("'","\\'")}',this.value)">${esc(v)}</textarea>`;html+='</div>'});html+=`</div>`});
html+=`<div class='card'><h3>📷 Fotoğraflar</h3><div class='notice'>Öneri: ZÜBER rafı • fiyat etiketi • rakip rafı • soğuk alan • teşhir fırsatı</div><input type='file' accept='image/*' multiple capture='environment' onchange='photos(event)'><div class='photos'>${(s.photos||[]).map((p,j)=>`<div><img src='${p.data}'><br><button class='choice danger' onclick='delPhoto(${j})'>Sil</button></div>`).join('')}</div></div>`;document.getElementById('visit').innerHTML=html;document.getElementById('visit').classList.remove('hidden')}
function ans(sec,q,v){let s=db[current.d].stores[current.i];s.answers[sec]=s.answers[sec]||{};s.answers[sec][q]=v;save()}function back(){document.getElementById('visit').classList.add('hidden');document.getElementById('home').classList.remove('hidden');renderHome()}function finish(){db[current.d].stores[current.i].status='Tamamlandı';save();back()}
function photos(e){let s=db[current.d].stores[current.i];[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{s.photos.push({name:f.name,data:r.result});try{save()}catch(err){alert('Tarayıcı depolama alanı doldu. Daha az/küçük fotoğraf kullan veya dışa aktar.');s.photos.pop()}openStore(current.i)};r.readAsDataURL(f)})}function delPhoto(j){db[current.d].stores[current.i].photos.splice(j,1);save();openStore(current.i)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ZUBER_RTM_Saha_'+day.value+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();renderHome();alert('Veriler yüklendi.')}catch{alert('Geçerli bir ZÜBER RTM JSON dosyası değil.')}};r.readAsText(f)}
renderHome();
</script></body></html>
